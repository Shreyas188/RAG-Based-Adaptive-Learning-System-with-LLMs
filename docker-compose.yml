# ============================================================
# docker-compose.yml — RAG Adaptive Learning System
# ============================================================
version: "3.9"

services:
  # ---- FastAPI Backend ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                        # Persist uploads + SQLite DB
      - ./vector_db:/app/vector_db              # Persist ChromaDB
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CHROMA_PERSIST_DIR=/app/vector_db/chroma_store
      - SQLITE_DB_PATH=/app/data/rag_system.db
      - UPLOAD_DIR=/app/data/uploads
      - LOG_FILE=/app/data/app.log
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag_network

  # ---- Streamlit Frontend ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  data:
  vector_db:
